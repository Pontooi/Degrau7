```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Degrau 7: Importação com FileReader e Reset</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}

.card-tela {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #334155;
}

.linha-inputs {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.barra-ferramentas {
    border-top: 1px dashed #334155;
    padding-top: 12px;
}

input {
    padding: 8px 12px;
    background: #0f172a;
    border: 1px solid #475569;
    border-radius: 6px;
    color: #fff;
}

.btn-acao {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    display: inline-flex;
    align-items: center;
}

.btn-azul { background: #0284c7; }
.btn-verde { background: #10b981; }
.btn-roxo { background: #8b5cf6; }
.btn-vermelho { background: #dc2626; }
.btn-amarelo {
    background: #d97706;
    padding: 4px 8px;
    font-size: 0.75rem;
}

.tabela-dados {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 0.85rem;
}

.tabela-dados th,
.tabela-dados td {
    padding: 8px 12px;
    border: 1px solid #334155;
    text-align: left;
}

.tabela-dados th {
    background: #0f172a;
    color: #38bdf8;
}
</style>
</head>

<body>

<div class="card-tela">

    <h3>Degrau 7: O Sistema Completo (Com I/O e Reset)</h3>

    <div class="linha-inputs">
        <input id="nome" placeholder="Nome">
        <input id="apelido" placeholder="Apelido">
        <input id="idade" type="number" placeholder="Idade" min="1">
        <input id="email" placeholder="E-mail">

        <button class="btn-acao btn-azul"
                id="btnSalvar"
                onclick="salvar()">
            Salvar
        </button>
    </div>

    <div class="linha-inputs barra-ferramentas">

        <button class="btn-acao btn-verde"
                onclick="exportar()">
            💾 Exportar
        </button>

        <label class="btn-acao btn-roxo">
            📂 Importar JSON
            <input type="file"
                   accept=".json"
                   onchange="importar(event)"
                   style="display:none;">
        </label>

        <button class="btn-acao btn-vermelho"
                onclick="resetar()">
            🔄 Resetar Tudo
        </button>

    </div>

    <table class="tabela-dados">

        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Apelido</th>
                <th>Idade</th>
                <th>E-mail</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="lista"></tbody>

    </table>

</div>

<script>

let alunos = [];
let idEditando = null;
let proximoId = 1;

const CHAVE = "alunos_degrau7_master";


// CARREGAR DADOS
function carregar() {

    const salvo = localStorage.getItem(CHAVE);

    if (salvo) {

        alunos = JSON.parse(salvo);

        proximoId = alunos.length
            ? Math.max(...alunos.map(a => a.id)) + 1
            : 1;
    }

    listar();
}


// SALVAR NO LOCALSTORAGE
function persistir() {

    localStorage.setItem(CHAVE, JSON.stringify(alunos));

}


// LISTAR ALUNOS
function listar() {

    const tbody = document.getElementById("lista");

    tbody.innerHTML = "";

    alunos.forEach(a => {

        tbody.innerHTML += `
            <tr>

                <td>${a.id}</td>

                <td>${a.nome}</td>

                <td>${a.apelido}</td>

                <td>${a.idade}</td>

                <td>${a.email}</td>

                <td>

                    <button
                        class="btn-acao btn-amarelo"
                        onclick="editar(${a.id})">
                        Editar
                    </button>

                    <button
                        class="btn-acao btn-vermelho"
                        onclick="excluir(${a.id})">
                        Excluir
                    </button>

                </td>

            </tr>
        `;

    });

}


// SALVAR / ATUALIZAR
function salvar() {

    const n = document.getElementById("nome");
    const a = document.getElementById("apelido");
    const i = document.getElementById("idade");
    const e = document.getElementById("email");

    if (!n.value) {
        return alert("Preencha o nome!");
    }

    if (!a.value) {
        return alert("Preencha o apelido!");
    }

    if (!i.value) {
        return alert("Preencha a idade!");
    }


    // EDITAR
    if (idEditando) {

        const aluno = alunos.find(x => x.id === idEditando);

        aluno.nome = n.value;
        aluno.apelido = a.value;
        aluno.idade = i.value;
        aluno.email = e.value;

        idEditando = null;

        document.getElementById("btnSalvar").innerText = "Salvar";

    }

    // NOVO CADASTRO
    else {

        alunos.push({

            id: proximoId++,

            nome: n.value,

            apelido: a.value,

            idade: i.value,

            email: e.value

        });

    }


    // LIMPAR CAMPOS
    n.value = "";
    a.value = "";
    i.value = "";
    e.value = "";


    persistir();

    listar();

}


// EDITAR
function editar(id) {

    const aluno = alunos.find(x => x.id === id);

    document.getElementById("nome").value = aluno.nome;

    document.getElementById("apelido").value = aluno.apelido;

    document.getElementById("idade").value = aluno.idade;

    document.getElementById("email").value = aluno.email;

    idEditando = id;

    document.getElementById("btnSalvar").innerText =
        "Atualizar #" + id;
}


// EXCLUIR
function excluir(id) {

    if (confirm("Excluir este aluno?")) {

        alunos = alunos.filter(a => a.id !== id);

        persistir();

        listar();
    }

}


// EXPORTAR JSON
function exportar() {

    const texto = JSON.stringify(alunos, null, 2);

    const blob = new Blob(
        [texto],
        { type: "application/json" }
    );

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);

    a.download = "alunos.json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(a.href);

}


// IMPORTAR JSON
function importar(evento) {

    const arquivo = evento.target.files[0];

    if (!arquivo) return;


    const leitor = new FileReader();


    leitor.onload = () => {

        try {

            const dados = JSON.parse(leitor.result);

            if (!Array.isArray(dados)) {

                throw new Error(
                    "O JSON precisa conter uma lista []"
                );

            }


            alunos = dados;

            proximoId = alunos.length
                ? Math.max(...alunos.map(a => a.id)) + 1
                : 1;


            persistir();

            listar();


            alert(
                "Sucesso! " +
                alunos.length +
                " alunos importados."
            );

        }

        catch (e) {

            alert(
                "Falha ao importar: " +
                e.message
            );

        }

    };


    leitor.readAsText(arquivo);

}


// RESETAR
function resetar() {

    if (!confirm(
        "Tem certeza que deseja apagar todo o banco de dados local?"
    )) return;


    localStorage.removeItem(CHAVE);

    alunos = [];

    proximoId = 1;

    idEditando = null;

    listar();

}


carregar();

</script>

</body>
</html>
